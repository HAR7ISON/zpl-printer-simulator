name: Build Windows installer
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Check renderer
        run: dotnet run --project tests/RendererChecks.csproj -- samples/test-label.zpl artifacts/preview
      - name: Check installer paths in Windows PowerShell
        shell: powershell
        run: |
          ./tests/InstallerPaths.ps1
          ./tests/InstallerPort.ps1
      - name: Build installers
        shell: powershell
        run: ./scripts/Build.ps1 -SetupExe
      - uses: actions/upload-artifact@v4
        with:
          name: ZplSimulator-windows-x64
          path: |
            artifacts/ZplSimulator-win-x64.zip
            artifacts/ZplSimulator-Setup.exe
